  function navigate(view){if(!renderers[view])return;state.view=view;document.getElementById('sidebar').classList.remove('open');render();main.focus({preventScroll:true})}
  function showToast(title,text=''){const toast=document.getElementById('toast');toast.innerHTML=`<strong>${esc(title)}</strong>${text?`<span>${esc(text)}</span>`:''}`;toast.classList.add('show');clearTimeout(state.toastTimer);state.toastTimer=setTimeout(()=>toast.classList.remove('show'),3000)}
  function openCitation(sourceId,sectionId,opener){const source=getSource(sourceId),section=getSection(sourceId,sectionId);if(!source||!section)return;state.drawerOpener=opener;document.getElementById('drawer-title').textContent=source.title;document.getElementById('drawer-context').textContent=`该原文支持当前已确认知识点 · 定位精度：${section.page}`;document.getElementById('drawer-content').innerHTML=`<div class="quote-meta">${esc(source.meta)}<br>${esc(section.page)} · ${esc(section.title)}</div><blockquote class="quote-block">${esc(section.text)}</blockquote><div class="quote-note"><strong>引用关系</strong><br>知识点只保存来源 ID、来源版本和段落锚点；移动知识树目录不会破坏引用。</div><button class="btn" style="margin-top:16px" data-action="open-full-source" data-source="${esc(sourceId)}" data-section="${esc(sectionId)}">在完整原文中查看 ${icon('arrow')}</button>`;document.getElementById('drawer-backdrop').classList.add('open');document.getElementById('source-drawer').classList.add('open');document.getElementById('source-drawer').setAttribute('aria-hidden','false');setTimeout(()=>document.querySelector('#source-drawer .icon-btn').focus(),40)}
  function closeDrawer(){document.getElementById('drawer-backdrop').classList.remove('open');document.getElementById('source-drawer').classList.remove('open');document.getElementById('source-drawer').setAttribute('aria-hidden','true');state.drawerOpener?.focus?.()}
  function closeWorkbench(){const menu=document.getElementById('workbench-menu');menu.classList.remove('open');document.querySelector('[data-action="toggle-workbench"]')?.setAttribute('aria-expanded','false')}
  function startImport(){if(state.importStage==='parsing')return;state.importDestination=document.getElementById('import-destination')?.value||state.importDestination;state.importStage='parsing';const seq=++state.importSeq;render();setTimeout(()=>{if(seq!==state.importSeq)return;const source={id:'winter',type:'MD',category:'园艺养护',title:'香草越冬观察笔记.md',updated:'刚刚',meta:'个人观察草稿 · 版本 v1 · 2 个段落',summary:'记录冬季室内香草的光照与浇水变化。',tags:['越冬','室内养护'],status:'ready',sections:[{id:'winter-1',line:'03',page:'§ 1.1',title:'减少浇水频率',text:'冬季室内蒸发变慢，检查频率可以保持，但不要沿用夏季浇水量。土壤内部仍湿时继续观察。'},{id:'winter-2',line:'09',page:'§ 2.2',title:'靠窗与通风',text:'白天放在明亮窗边，短时通风时避开冷风直吹；夜间与玻璃保持距离，减少温差影响。'}]};if(!getSource('winter'))state.sources.push(source);if(!state.extractions.some(x=>x.id==='ex-winter'))state.extractions.unshift({id:'ex-winter',sourceId:'winter',sectionId:'winter-1',suggestedTitle:'冬季检查频率不等于浇水频率',body:'冬季仍可定期检查土壤，但蒸发变慢时不能沿用夏季浇水量；内部仍湿则继续观察。',tags:['越冬','浇水','室内'],destinationNodeId:'d-garden',status:'pending'});state.extractionId='ex-winter';state.importStage='done';event('import','导入来源：香草越冬观察笔记','解析 2 个章节 · 已生成 1 条提炼候选');showToast('解析完成','新的候选知识点已进入提炼审查。');if(state.view==='import')render();else renderNav()},850)}
  function confirmExtraction(){const x=state.extractions.find(i=>i.id===state.extractionId);if(!x)return;const id='p-'+Date.now();state.treeNodes.push({id,parentId:x.destinationNodeId,type:'point',title:x.suggestedTitle,body:x.body,sourceId:x.sourceId,sectionId:x.sectionId});const reviewId='rv-'+Date.now();const short=x.suggestedTitle.replace(/[，。]/g,'');state.reviewCards.push({id:reviewId,pointId:id,prompt:`请复述：${short}`,answer:x.body,sourceId:x.sourceId,sectionId:x.sectionId,intervalDays:1,lastReviewedAt:'尚未复习',nextReviewAt:'今天',lapses:0,reviewCount:0,history:[]});state.reviewQueue.push(reviewId);x.status='accepted';state.expanded.push(x.destinationNodeId);event('organize',`确认知识点：${x.suggestedTitle}`,`加入 ${pathFor(x.destinationNodeId)}`);state.treeNodeId=id;state.extractionId=pendingExtractions()[0]?.id||'';showToast('已加入知识树',`${pathFor(id)} · 已生成复习卡。`);render()}
  function runQA(prompt){state.qaPrompt=prompt||'请根据当前范围总结最重要的行动规则。';state.qaStage='loading';const seq=++state.qaSeq;renderQA();setTimeout(()=>{if(seq!==state.qaSeq)return;state.qaStage='done';event('qa','向知识库提问',`范围：${pathFor(scopeNode().id)} · ${state.qaPrompt}`);if(state.view==='qa')renderQA()},700)}
  function rateReview(grade){const card=currentReview();if(!card)return;const old=card.intervalDays;let days=0,label='';if(grade==='forgot'){days=0;label='忘记了';card.lapses++;state.reviewQueue.shift();state.reviewQueue.push(card.id)}if(grade==='hard'){days=Math.max(1,Math.round(old*1.2));label='困难';state.reviewQueue.shift()}if(grade==='good'){days=old<=1?3:Math.round(old*2.2);label='记得';state.reviewQueue.shift()}if(grade==='easy'){days=old<=1?7:Math.round(old*3.2);label='很熟练';state.reviewQueue.shift()}card.intervalDays=days;card.lastReviewedAt='刚刚';card.nextReviewAt=days===0?'本轮稍后':`${days} 天后`;card.reviewCount++;card.history.push({grade,days});event('review',`完成复习：${getNode(card.pointId)?.title||card.prompt}`,`反馈「${label}」· 下次${card.nextReviewAt}`,{grade});state.reviewShowAnswer=false;showToast(`已记录「${label}」`,days===0?'这张卡会在本轮稍后再次出现。':`下次复习安排在约 ${days} 天后。`);render()}
  document.addEventListener('click',e=>{const viewEl=e.target.closest('[data-view]');if(viewEl){navigate(viewEl.dataset.view);return}const el=e.target.closest('[data-action]');if(!el)return;const action=el.dataset.action;
    if(action==='toggle-mobile-nav')document.getElementById('sidebar').classList.toggle('open');
    if(action==='toggle-workbench'){const menu=document.getElementById('workbench-menu');menu.classList.toggle('open');el.setAttribute('aria-expanded',menu.classList.contains('open'))}if(action==='close-workbench')closeWorkbench();if(action==='preview-workbench'){closeWorkbench();showToast(`${el.dataset.name} · 规划中的工作台`,'当前 Demo 先实现知识管理；平台壳层已为后续工作台保留入口。')}
    if(action==='close-drawer')closeDrawer();if(action==='open-citation'){openCitation(el.dataset.source,el.dataset.section,el);event('organize','打开来源证据',`${getSource(el.dataset.source)?.title} · ${getSection(el.dataset.source,el.dataset.section)?.page}`)}
    if(action==='open-full-source'){closeDrawer();const sourceNode=state.treeNodes.find(n=>n.type==='source'&&n.sourceId===el.dataset.source);if(sourceNode){state.treeNodeId=sourceNode.id;state.highlightSection=el.dataset.section;state.expanded=[...new Set([...state.expanded,sourceNode.parentId,getNode(sourceNode.parentId)?.parentId,'root'])];navigate('tree')}}
    if(action==='show-data-info')showToast('这是本地交互演示','无后端、无真实上传、无真实模型调用；关键流程会更新内存状态。');
    if(action==='reset-demo'){state.importSeq++;state.qaSeq++;state=createInitialState();showToast('演示已重置','七个工作流的 mock 状态已恢复。');render()}
    if(action==='start-import')startImport();if(action==='reset-import'){state.importStage='select';renderImport()}
    if(action==='select-extraction'){state.extractionId=el.dataset.id;renderExtract()}if(action==='confirm-extraction')confirmExtraction();if(action==='mark-unverified'){const x=state.extractions.find(i=>i.id===state.extractionId);if(x){x.status='unverified';event('organize',`标记待验证：${x.suggestedTitle}`,'保留在审查队列，不进入知识树');showToast('已标记待验证','该候选仍保留在审查队列。');renderExtract()}}if(action==='reject-extraction'){const x=state.extractions.find(i=>i.id===state.extractionId);if(x){x.status='rejected';event('organize',`忽略候选：${x.suggestedTitle}`,'未加入知识树');state.extractionId=pendingExtractions()[0]?.id||'';showToast('已忽略候选','原始来源仍然完整保留。');render()}}
    if(action==='toggle-tree-node'){e.stopPropagation();const id=el.dataset.id;state.expanded=state.expanded.includes(id)?state.expanded.filter(x=>x!==id):[...state.expanded,id];renderTree()}if(action==='select-tree-node'){state.treeNodeId=el.dataset.id;state.highlightSection='';renderTree()}if(action==='search-tree-node'){state.treeNodeId=el.dataset.id;state.treeQuery='';state.highlightSection='';let parent=getNode(el.dataset.id)?.parentId;while(parent){state.expanded=[...new Set([...state.expanded,parent])];parent=getNode(parent)?.parentId}renderTree()}if(action==='clear-tree-search'){state.treeQuery='';renderTree();requestAnimationFrame(()=>document.getElementById('tree-search-input')?.focus())}if(action==='open-tree-node'){state.treeNodeId=el.dataset.id;navigate('tree')}if(action==='ask-node'){state.qaNodeId=el.dataset.id;state.qaScope='point';state.qaStage='idle';navigate('qa')}if(action==='review-node'){const idx=state.reviewQueue.indexOf(el.dataset.id);if(idx>0)state.reviewQueue=[el.dataset.id,...state.reviewQueue.filter(x=>x!==el.dataset.id)];navigate('review')}
    if(action==='set-qa-scope'){state.qaScope=el.dataset.scope;state.qaStage='idle';renderQA()}if(action==='toggle-descendants'){state.qaDescendants=!state.qaDescendants;renderQA()}if(action==='toggle-general'){state.qaGeneral=!state.qaGeneral;renderQA()}if(action==='ask-prompt')runQA(el.dataset.prompt);if(action==='send-qa'){const input=document.getElementById('qa-input');runQA(input?.value.trim())}if(action==='reset-qa'){state.qaSeq++;state.qaStage='idle';state.qaPrompt='';renderQA()}
    if(action==='reveal-review'){state.reviewShowAnswer=true;renderReview()}if(action==='rate-review')rateReview(el.dataset.grade);if(action==='filter-history'){state.historyFilter=el.dataset.filter;renderHistory()}
  });
  document.addEventListener('input',e=>{if(e.target.id==='tree-search-input'){state.treeQuery=e.target.value;const caret=e.target.selectionStart;renderTree();requestAnimationFrame(()=>{const input=document.getElementById('tree-search-input');input?.focus();input?.setSelectionRange(caret,caret)});return}if(!e.target.matches('[data-edit]'))return;const x=state.extractions.find(i=>i.id===state.extractionId);if(!x)return;if(e.target.dataset.edit==='title')x.suggestedTitle=e.target.value;if(e.target.dataset.edit==='body')x.body=e.target.value;if(e.target.dataset.edit==='tags')x.tags=e.target.value.split(/[，,]/).map(t=>t.trim()).filter(Boolean)});
  document.addEventListener('change',e=>{if(e.target.id==='library-select'){const previous=state.currentLibrary;state.currentLibrary=e.target.value;if(e.target.value!=='我的知识库'){showToast(`${e.target.value} · 演示空间`,'当前 Demo 数据仅属于“我的知识库”，已保留知识库切换层级。');setTimeout(()=>{state.currentLibrary=previous;e.target.value=previous},0)}}if(e.target.id==='import-destination')state.importDestination=e.target.value;if(e.target.dataset.edit==='destination'){const x=state.extractions.find(i=>i.id===state.extractionId);if(x)x.destinationNodeId=e.target.value}});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.view==='tree'&&state.treeQuery){state.treeQuery='';renderTree();requestAnimationFrame(()=>document.getElementById('tree-search-input')?.focus())}else if(document.getElementById('source-drawer').classList.contains('open'))closeDrawer();else{closeWorkbench();document.getElementById('sidebar').classList.remove('open')}}const row=e.target.closest?.('.tree-row');if(!row)return;const rows=[...document.querySelectorAll('.tree-row')],idx=rows.indexOf(row);if(e.key==='ArrowDown'){e.preventDefault();rows[idx+1]?.focus()}if(e.key==='ArrowUp'){e.preventDefault();rows[idx-1]?.focus()}if(e.key==='ArrowRight'){e.preventDefault();const id=row.dataset.id;if(childrenOf(id).length&&!state.expanded.includes(id)){state.expanded.push(id);renderTree();document.querySelector(`.tree-row[data-id="${id}"]`)?.focus()}}if(e.key==='ArrowLeft'){e.preventDefault();const id=row.dataset.id;if(state.expanded.includes(id)){state.expanded=state.expanded.filter(x=>x!==id);renderTree();document.querySelector(`.tree-row[data-id="${id}"]`)?.focus()}else{const p=getNode(id)?.parentId;document.querySelector(`.tree-row[data-id="${p}"]`)?.focus()}}if(e.key==='Enter'){e.preventDefault();state.treeNodeId=row.dataset.id;renderTree()}});
  render();
})();
</script>
