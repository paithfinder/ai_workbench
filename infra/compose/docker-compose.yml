services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_workbench}
      POSTGRES_USER: ${POSTGRES_USER:-knowledge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knowledge_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-knowledge} -d ${POSTGRES_DB:-knowledge_workbench}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-knowledge-sources}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY &&
      mc mb --ignore-existing local/$$S3_BUCKET &&
      mc anonymous set none local/$$S3_BUCKET &&
      printf '%s' '<CORSConfiguration><CORSRule><AllowedOrigin>http://localhost:3000</AllowedOrigin><AllowedMethod>POST</AllowedMethod><AllowedMethod>GET</AllowedMethod><AllowedMethod>HEAD</AllowedMethod><AllowedHeader>*</AllowedHeader><ExposeHeader>ETag</ExposeHeader><MaxAgeSeconds>3600</MaxAgeSeconds></CORSRule></CORSConfiguration>' > /tmp/cors.xml &&
      mc cors set local/$$S3_BUCKET /tmp/cors.xml &&
      mc ilm rule add --expire-days 1 --prefix uploads/ local/$$S3_BUCKET
      "

  migrate:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: ../../.env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_workbench}
      POSTGRES_USER: ${POSTGRES_USER:-knowledge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knowledge_dev}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-knowledge-sources}
      S3_SECURE: "false"
      S3_PRESIGN_TTL_SECONDS: ${S3_PRESIGN_TTL_SECONDS:-900}
      MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-26214400}
      MAX_PASTED_TEXT_SIZE_BYTES: ${MAX_PASTED_TEXT_SIZE_BYTES:-1048576}
      WEB_FETCH_CONNECT_TIMEOUT_SECONDS: ${WEB_FETCH_CONNECT_TIMEOUT_SECONDS:-5.0}
      WEB_FETCH_TOTAL_TIMEOUT_SECONDS: ${WEB_FETCH_TOTAL_TIMEOUT_SECONDS:-15.0}
      WEB_FETCH_MAX_BODY_BYTES: ${WEB_FETCH_MAX_BODY_BYTES:-5242880}
      WEB_FETCH_MAX_REDIRECTS: ${WEB_FETCH_MAX_REDIRECTS:-5}
      CELERY_BROKER_URL: redis://redis:6379/1
      JOB_ATTEMPT_LEASE_SECONDS: ${JOB_ATTEMPT_LEASE_SECONDS:-300}
      PARSE_ATTEMPT_LEASE_SECONDS: ${PARSE_ATTEMPT_LEASE_SECONDS:-1800}
      PARSE_HEARTBEAT_SECONDS: ${PARSE_HEARTBEAT_SECONDS:-30}
      PARSE_TIMEOUT_SECONDS: ${PARSE_TIMEOUT_SECONDS:-1800}
      PARSE_MAX_PAGES: ${PARSE_MAX_PAGES:-200}
      PARSE_MAX_SOURCE_BYTES: ${PARSE_MAX_SOURCE_BYTES:-26214400}
      PARSE_ENABLE_OCR: ${PARSE_ENABLE_OCR:-true}
      PARSE_OCR_LANGUAGES: ${PARSE_OCR_LANGUAGES:-["en","zh"]}
      PARSE_ARTIFACT_PREFIX: ${PARSE_ARTIFACT_PREFIX:-artifacts}
      PARSER_NAME: ${PARSER_NAME:-docling}
      PARSER_VERSION: ${PARSER_VERSION:-2.117.0}
      OUTBOX_RELAY_INTERVAL_SECONDS: ${OUTBOX_RELAY_INTERVAL_SECONDS:-1.0}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-50}
      AI_PROVIDER: ${AI_PROVIDER:-fake}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-opus-5}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-120}
      EXTRACTION_MAX_OUTPUT_TOKENS: ${EXTRACTION_MAX_OUTPUT_TOKENS:-16000}
      EXTRACTION_BATCH_MAX_CHARACTERS: ${EXTRACTION_BATCH_MAX_CHARACTERS:-24000}
    command: ["alembic", "-c", "apps/api/alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: ../../.env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_workbench}
      POSTGRES_USER: ${POSTGRES_USER:-knowledge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knowledge_dev}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-knowledge-sources}
      S3_SECURE: "false"
      S3_PRESIGN_TTL_SECONDS: ${S3_PRESIGN_TTL_SECONDS:-900}
      MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-26214400}
      MAX_PASTED_TEXT_SIZE_BYTES: ${MAX_PASTED_TEXT_SIZE_BYTES:-1048576}
      WEB_FETCH_CONNECT_TIMEOUT_SECONDS: ${WEB_FETCH_CONNECT_TIMEOUT_SECONDS:-5.0}
      WEB_FETCH_TOTAL_TIMEOUT_SECONDS: ${WEB_FETCH_TOTAL_TIMEOUT_SECONDS:-15.0}
      WEB_FETCH_MAX_BODY_BYTES: ${WEB_FETCH_MAX_BODY_BYTES:-5242880}
      WEB_FETCH_MAX_REDIRECTS: ${WEB_FETCH_MAX_REDIRECTS:-5}
      CELERY_BROKER_URL: redis://redis:6379/1
      JOB_ATTEMPT_LEASE_SECONDS: ${JOB_ATTEMPT_LEASE_SECONDS:-300}
      PARSE_ATTEMPT_LEASE_SECONDS: ${PARSE_ATTEMPT_LEASE_SECONDS:-1800}
      PARSE_HEARTBEAT_SECONDS: ${PARSE_HEARTBEAT_SECONDS:-30}
      PARSE_TIMEOUT_SECONDS: ${PARSE_TIMEOUT_SECONDS:-1800}
      PARSE_MAX_PAGES: ${PARSE_MAX_PAGES:-200}
      PARSE_MAX_SOURCE_BYTES: ${PARSE_MAX_SOURCE_BYTES:-26214400}
      PARSE_ENABLE_OCR: ${PARSE_ENABLE_OCR:-true}
      PARSE_OCR_LANGUAGES: ${PARSE_OCR_LANGUAGES:-["en","zh"]}
      PARSE_ARTIFACT_PREFIX: ${PARSE_ARTIFACT_PREFIX:-artifacts}
      PARSER_NAME: ${PARSER_NAME:-docling}
      PARSER_VERSION: ${PARSER_VERSION:-2.117.0}
      OUTBOX_RELAY_INTERVAL_SECONDS: ${OUTBOX_RELAY_INTERVAL_SECONDS:-1.0}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-50}
      AI_PROVIDER: ${AI_PROVIDER:-fake}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-opus-5}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-120}
      EXTRACTION_MAX_OUTPUT_TOKENS: ${EXTRACTION_MAX_OUTPUT_TOKENS:-16000}
      EXTRACTION_BATCH_MAX_CHARACTERS: ${EXTRACTION_BATCH_MAX_CHARACTERS:-24000}
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: ../../.env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_workbench}
      POSTGRES_USER: ${POSTGRES_USER:-knowledge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knowledge_dev}
      CELERY_BROKER_URL: redis://redis:6379/1
      JOB_ATTEMPT_LEASE_SECONDS: ${JOB_ATTEMPT_LEASE_SECONDS:-300}
    command: ["celery", "-A", "knowledge_workbench.worker.celery_app:celery_app", "worker", "--loglevel=INFO", "--queues=source-ingest"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  parse-worker:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: ../../.env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_workbench}
      POSTGRES_USER: ${POSTGRES_USER:-knowledge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knowledge_dev}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-knowledge-sources}
      S3_SECURE: "false"
      JOB_ATTEMPT_LEASE_SECONDS: ${JOB_ATTEMPT_LEASE_SECONDS:-300}
      PARSE_ATTEMPT_LEASE_SECONDS: ${PARSE_ATTEMPT_LEASE_SECONDS:-1800}
      PARSE_HEARTBEAT_SECONDS: ${PARSE_HEARTBEAT_SECONDS:-30}
      PARSE_TIMEOUT_SECONDS: ${PARSE_TIMEOUT_SECONDS:-1800}
      PARSE_MAX_PAGES: ${PARSE_MAX_PAGES:-200}
      PARSE_MAX_SOURCE_BYTES: ${PARSE_MAX_SOURCE_BYTES:-26214400}
      PARSE_ENABLE_OCR: ${PARSE_ENABLE_OCR:-true}
      PARSE_OCR_LANGUAGES: ${PARSE_OCR_LANGUAGES:-["en","zh"]}
      PARSE_ARTIFACT_PREFIX: ${PARSE_ARTIFACT_PREFIX:-artifacts}
      PARSER_NAME: ${PARSER_NAME:-docling}
      PARSER_VERSION: ${PARSER_VERSION:-2.117.0}
    command: ["celery", "-A", "knowledge_workbench.worker.celery_app:celery_app", "worker", "--loglevel=INFO", "--queues=source-parse", "--concurrency=1"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  extract-worker:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: ../../.env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_workbench}
      POSTGRES_USER: ${POSTGRES_USER:-knowledge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knowledge_dev}
      CELERY_BROKER_URL: redis://redis:6379/1
      JOB_ATTEMPT_LEASE_SECONDS: ${JOB_ATTEMPT_LEASE_SECONDS:-300}
      AI_PROVIDER: ${AI_PROVIDER:-fake}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-opus-5}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-120}
      EXTRACTION_MAX_OUTPUT_TOKENS: ${EXTRACTION_MAX_OUTPUT_TOKENS:-16000}
      EXTRACTION_BATCH_MAX_CHARACTERS: ${EXTRACTION_BATCH_MAX_CHARACTERS:-24000}
    command: ["celery", "-A", "knowledge_workbench.worker.celery_app:celery_app", "worker", "--loglevel=INFO", "--queues=source-extract", "--concurrency=1"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  relay:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: ../../.env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_workbench}
      POSTGRES_USER: ${POSTGRES_USER:-knowledge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knowledge_dev}
      CELERY_BROKER_URL: redis://redis:6379/1
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-knowledge-sources}
      S3_SECURE: "false"
      OUTBOX_RELAY_INTERVAL_SECONDS: ${OUTBOX_RELAY_INTERVAL_SECONDS:-1.0}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-50}
    command: ["python", "-m", "knowledge_workbench.worker.outbox_relay"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    env_file:
      - path: ../../.env
        required: false
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      INTERNAL_API_BASE_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  minio-data:
